name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
      publish:
        description: Publish the verified release (off leaves a draft)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Validate the version tag
        id: version
        env:
          KYL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/publish-release.mjs --check-tag
      - name: Check Apple release credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            const required = ["DEVELOPER_ID_P12", "DEVELOPER_ID_P12_PASSWORD", "NOTARY_KEY_P8", "NOTARY_KEY_ID", "NOTARY_ISSUER"];
            const missing = required.filter(name => !process.env[name]);
            if (missing.length) throw new Error(`Missing repository secrets: ${missing.join(", ")}`);
          '
  checks:
    needs: validate
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  macos:
    needs: [validate, checks]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Install pinned Zamok packaging tool
        env:
          ZAMOK_VERSION: 1.10.1
          ZAMOK_SHA256: f227c8b546f85b3f88ab541190516e6218dadff4f6ad8ff3d12a10d3a58101d2
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/bshk-app/homebrew-tap/releases/download/zamokctl-${ZAMOK_VERSION}/zamokctl-${ZAMOK_VERSION}-macos-arm64.tar.gz" \
            --output "$RUNNER_TEMP/zamokctl.tar.gz"
          printf '%s  %s\n' "$ZAMOK_SHA256" "$RUNNER_TEMP/zamokctl.tar.gz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/zamok-bin"
          tar -xzf "$RUNNER_TEMP/zamokctl.tar.gz" -C "$RUNNER_TEMP/zamok-bin"
          echo "$RUNNER_TEMP/zamok-bin" >> "$GITHUB_PATH"
      - name: Import Developer ID into a temporary Keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          curl --fail --silent --show-error --location --retry 3 \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$RUNNER_TEMP/DeveloperIDCA.cer"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          existing=()
          while IFS= read -r entry; do existing+=("${entry//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/DeveloperIDCA.cer"
      - name: Write the Apple notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Build, sign, notarize and verify the macOS DMG
        env:
          KYL_SIGNING_IDENTITY_SHA1: ${{ secrets.RELEASE_SIGNING_IDENTITY_SHA1 }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: bun run package:macos:ci
      - name: Attach the verified DMG and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KnowYourLimits-macos-arm64
          path: |
            artifacts/macos/*/*.dmg
            artifacts/macos/*/manifest.json
          if-no-files-found: error
      - name: Remove temporary Apple credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/DeveloperIDCA.cer"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
  publish:
    needs: [validate, checks, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KnowYourLimits-windows-x64
          path: artifacts/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KnowYourLimits-macos-arm64
          path: artifacts/macos
      - name: Verify and publish both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          KYL_GITHUB_REPOSITORY: ${{ github.repository }}
          KYL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          KYL_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [ "$KYL_PUBLISH" = true ]; then
            node scripts/publish-release.mjs
          else
            node scripts/publish-release.mjs --draft
          fi
